name: 素材完整版 Windows 验收
on:
  push:
    branches: [feat/asset-transcript-workflow]
  pull_request:
    paths: ['app/**', 'scripts/test-assets*', '.github/workflows/assets-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assets-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - name: 安装独立前端
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: 生成绑定
        shell: bash
        run: |
          bash app/scripts/prepare-embed-dir.sh
          cd app
          wails generate module
      - name: 前端检查与测试
        working-directory: app/frontend
        run: |
          pnpm check
          pnpm test
          pnpm build
      - name: Go 检查与测试
        working-directory: app
        shell: pwsh
        run: |
          $files = @(gofmt -l bindings_assets.go bindings_assets_test.go bindings_transcript.go bindings_whisper.go bindings_download.go)
          if ($files.Count) { throw ($files -join ', ') }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -shuffle=on -count=1 ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 构建完整桌面程序
        shell: bash
        run: bash app/scripts/build.sh -platform windows/amd64
      - name: 保存测试安装产物
        uses: actions/upload-artifact@v6
        with:
          name: MediaHarvest-Wails-Windows-x64
          path: app/build/bin/*
          if-no-files-found: error
          retention-days: 14
